    Experience:
      - company: 清华大学科研合作
        position: Agent Memory Research · Co-author
        location: 北京
        start_date: 2025-12
        end_date: 2026-05
        summary: Threader — 无损长效对话记忆框架（NeurIPS 2026 under review）
        highlights:
          - 面向传统压缩式记忆的信息丢失、高延迟与高成本问题，参与设计无损长效记忆框架 Threader。
          - 提出“主题分割 + 多视角编码 + 多信号检索”范式，在完整保留信息的同时显著提升构建效率并降低 Token 成本。
          - 在多项长对话记忆基准上超过 MemGPT、Mem0 等代表性方法，改善智能体长程一致性与响应效率。

      - company: 北京理工大学
        position: Multimodal Learning & Neural Interpretability · Co-author
        location: 北京
        start_date: 2025-09
        end_date: 2026-05
        summary: SAIL — 基于稀疏自编码器的脑—模型语义对齐框架（NeurIPS 2026 under review）
        highlights:
          - 参与构建基于稀疏自编码器的脑—模型语义对齐框架，研究多模态大模型内部表征的可解释性。
          - 将高维视觉特征解耦为单语义概念，并与人类视觉皮层 fMRI 信号进行匹配。
          - 验证 SAE 特征相较原始模型特征在人脑对齐任务上的性能优势。

      - company: 字节跳动 · 火山方舟
        position: 产品解决方案实习生
        location: 北京
        start_date: 2026-04
        end_date: 2026-06
        summary: 面向企业客户的 AI 产品与 MaaS 解决方案设计。
        highlights:
          - 参与梳理大模型能力、业务场景与产品落地路径，支持 ToB AI 产品解决方案设计。

    Projects:
      - name: Collector+（Collector-AI）
        url: https://github.com/Sophie618/Creator_ai
        summary: 基于线性单体架构的低延迟信息提取与游戏化阅读助手。
        highlights:
          - FastAPI 异步管道将端到端生成延迟压缩至约 15–30 秒。
          - 实现微信公众号 / B 站通用内容解析，以及基于 React 的“直觉对赌”交互。

      - name: FitSnap
        url: https://fit-snap-beige.vercel.app/
        summary: 基于视频语义理解的结构化指令生成系统。
        highlights:
          - 利用 DeepSeek-V3 将视频字幕转换为包含时间戳、操作分类与关键参数的结构化步骤。
          - 使用 Next.js 16、React 19 与 Zustand 实现视频与步骤卡双向联动。

      - name: BiGEM 数据检索与可视化平台
        url: https://2025.igem.wiki/bit-china/software
        summary: 2025 iGEM 国际金奖、全球本科生组 Best Software。
        highlights:
          - 使用 Python 清洗 20 年竞赛数据，并以 D3.js / Three.js 呈现合作网络与知识关联。
          - 接入大模型语义分析以增强生物元件与历史项目检索。

      - name: Multi-Agent Shopping Assistant
        url: https://github.com/Sophie618/Multi-Agent
        summary: 基于 MCP 协议的电商智能助手平台。
        highlights:
          - 完成 LLM → Router → MCP Server → Backend API 工具调用链路。
          - 使用 Vue 3 构建对话界面并将工具执行结果渲染为商品卡片。

